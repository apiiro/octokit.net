name: CI Build

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 6
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Restore
      run: dotnet restore Octokit.sln

    - name: Build
      run: dotnet build Octokit.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test Octokit.Tests/Octokit.Tests.csproj --configuration Release --no-build --verbosity normal
